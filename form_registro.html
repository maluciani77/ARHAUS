<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="./css/form_registro.css">
</head>
<body>
    <div class="registro-container">
        <img class="avatar" src="images/logo.svg" alt="Logo de ARHAUS">
        <h2>Registro de Usuario</h2>
        <form action="procesar_registro.php" method="POST">
            <label for="nombre">Usuario:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>

            <label for="confirm_password">Confirmar Contraseña:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite la contraseña" required>

            <button type="submit">Registrar</button>
        </form>
        <div class="mensaje">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
