<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<!-- devices setting -->
	<!-- Sin "user-scalable=no": con eso puesto el telefono no dejaba agrandar
	     la pagina con los dedos, y hay gente que lo necesita para leer. -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title> Contacto - ARHAUS </title>
	<!-- SEO -->
	<link rel="canonical" href="https://arhaus.com.ar/contacto/" />

	<!-- OJO: el ?v= de los css y js de abajo es lo que hace que el navegador
	     y el CDN sirvan la versión nueva. Si se cambia alguno de esos archivos,
	     hay que subirle el número acá, o la gente sigue viendo el viejo. -->
	<link rel="stylesheet" href="css/master_contacto.css?v=20260925">
	<link rel="stylesheet" href="css/nav-vertical.css?v=20260925">
	<!-- Link con CSS principal --> 
	<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
	<script src="js/jquery-3.3.1.min.js?v=20260925"></script> <!-- Link con JQuery -->
	<script src="js/main.js?v=20260925" defer></script> <!-- Link con JavaScript principal -->
	<script src="js/script.js?v=20260925"></script> <!-- Link con JavaScript principal 2 -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!--<link rel="icon" href="favicon.svg" sizes="32x32" />-->
	<!--<link href='https://arhaus.com.ar/favicon.svg' rel='icon' type='image/x-icon'/>-->
	<link rel="shortcut icon" href="favicon.svg" type="image/svg">
	<!-- Va al final: desarma el posicionamiento absoluto de master_contacto.css -->
	<link rel="stylesheet" href="css/contacto-form.css?v=20261027">
</head>
<body>
	
	<!-- NAV -->
    <nav>
        <div class="nav__container">
            <a href="index.html"><img src="images/logo-dark.svg" class="Logo logo_hov" alt="ARHAUS Logo"></a>
            <label for="menu" class="nav__label"></label>
            <input type="checkbox" id="menu" class="nav__input">
            <div class="nav__menu">
                <a href="index.html" class="nav__item">← Volver al inicio</a>
            </div>
        </div>
    </nav>

	<!-- CONTACTO -->
	<main class="contacto">
		<h1 class="contacto__titulo">Hablemos de tu proyecto</h1>

		<div class="contacto__grilla">
			<!-- Primero el formulario, que es a lo que se viene; los datos
			     quedan al costado. En el celular la grilla se hace de una
			     sola columna y este orden es tambien el de arriba a abajo. -->
			<!-- Sin JavaScript el formulario va igual: cae en contacto.php,
			     que manda el mail y dibuja el resultado en su propia página. -->
			<form class="contacto__form" method="post" action="contacto.php" data-contacto>
				<div class="contacto__campo">
					<label for="contacto-nombre">Nombre</label>
					<input type="text" id="contacto-nombre" name="nombre" maxlength="80" required autocomplete="name">
				</div>

				<div class="contacto__campo">
					<label for="contacto-email">Correo</label>
					<input type="email" id="contacto-email" name="email" maxlength="120" required autocomplete="email">
				</div>

				<div class="contacto__campo contacto__campo--ancho">
					<label for="contacto-telefono">Teléfono <span>(opcional)</span></label>
					<input type="tel" id="contacto-telefono" name="telefono" maxlength="40" autocomplete="tel">
				</div>

				<div class="contacto__campo contacto__campo--ancho">
					<label for="contacto-mensaje">Mensaje</label>
					<textarea id="contacto-mensaje" name="mensaje" maxlength="3000" required placeholder="Contanos qué tenés en mente: el lugar, la idea, en qué etapa estás."></textarea>
				</div>

				<div class="contacto__trampa" aria-hidden="true">
					<label for="contacto-sitio">No completar</label>
					<input type="text" id="contacto-sitio" name="sitio_web" tabindex="-1" autocomplete="off">
				</div>

				<p class="contacto__aviso" data-aviso role="status" hidden></p>

				<button type="submit" class="contacto__enviar" data-enviar>Enviar mensaje</button>
			</form>

			<aside class="contacto__datos">
				<div class="contenedor">
					<h2><i><a href="mailto:info@arhaus.com.ar">INFO@ARHAUS.COM.AR</a></i></h2>
				</div>

				<dl class="contacto__dato">
					<dt>Instagram</dt>
					<dd><a href="https://www.instagram.com/arhausdevelopers/" target="_blank" rel="noopener">@arhausdevelopers</a></dd>
				</dl>

				<!-- El formulario deja un mensaje y espera respuesta; esto abre una
				     conversación en el acto. El texto va escrito de antemano para
				     que nadie se quede mirando un campo vacío, pero se puede
				     cambiar antes de enviarlo. -->
				<a class="contacto__whatsapp" href="https://wa.me/5491134564660?text=Hola%2C%20los%20contacto%20desde%20la%20web%20de%20ARHAUS.%20Me%20gustar%C3%ADa%20conversar%20sobre%20un%20proyecto." target="_blank" rel="noopener">
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path d="M4 20l1.2-3.8A8 8 0 1 1 8.1 19z"/>
						<path d="M9.2 8.6c.2 2.6 3.4 5.9 6 6.1l1.2-1.4-2-1-.9.9c-1-.4-2.3-1.7-2.7-2.7l.9-.9-1-2z"/>
					</svg>
					<span>Hablar con el arquitecto</span>
				</a>
				<p class="contacto__whatsapp-nota">Se abre WhatsApp con el mensaje ya escrito.</p>
			</aside>
		</div>
	</main>

	<script src="js/contacto.js?v=20260925"></script>
</body>
</html>
