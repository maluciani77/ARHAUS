<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ARHAUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_index.css">
</head>
<body>
    <div>
        <div class="login-box">
            <img class="avatar" src="images/logo.svg" alt="Logo de ARHAUS">
            <form action="login.php" method="POST">
                <p id="login-error" style="display:none;color:#e21313;font-size:0.9rem;margin:0 0 10px;"></p>

                <!-- EMAIL -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="" required autofocus>
                <!-- PASSWORD -->
                <label for="password">Password</label>
                <div class="campo-clave">
                    <input type="password" id="password" name="password" placeholder="" required>
                    <button type="button" class="ver-clave" data-ver-clave aria-label="Mostrar la contraseña" aria-pressed="false" title="Mostrar la contraseña">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path class="ver-clave__ojo" d="M1.8 12S5.4 5.5 12 5.5 22.2 12 22.2 12 18.6 18.5 12 18.5 1.8 12 1.8 12Z"/>
                            <circle class="ver-clave__ojo" cx="12" cy="12" r="3.2"/>
                            <path class="ver-clave__tachado" d="M4 20 20 4"/>
                        </svg>
                    </button>
                </div>

                <input type="submit" value="Log In">

                <p style="font-size:0.85rem;opacity:0.8;margin-top:10px;">¿No tenés cuenta? Pedísela al estudio.</p>
            </form>
        </div>
    </div>

    <script>
        if (new URLSearchParams(location.search).get('error') === '1') {
            var p = document.getElementById('login-error');
            p.textContent = 'Email o contraseña incorrectos.';
            p.style.display = 'block';
        }

        // El ojito: muestra la contraseña mientras se escribe, para poder
        // revisar que esté bien antes de mandarla.
        (function () {
            var boton = document.querySelector('[data-ver-clave]');
            var campo = document.getElementById('password');
            if (!boton || !campo) return;

            boton.addEventListener('click', function () {
                var seVe = campo.type === 'text';
                campo.type = seVe ? 'password' : 'text';
                boton.classList.toggle('esta-viendo', !seVe);
                boton.setAttribute('aria-pressed', String(!seVe));
                var texto = seVe ? 'Mostrar la contraseña' : 'Ocultar la contraseña';
                boton.setAttribute('aria-label', texto);
                boton.setAttribute('title', texto);
                // El foco vuelve al campo, al final del texto, para poder seguir escribiendo.
                campo.focus();
                var largo = campo.value.length;
                try { campo.setSelectionRange(largo, largo); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
