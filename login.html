<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ARHAUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_index.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div>
        <div class="login-box">
            <img class="avatar" src="images/logo.svg" alt="Logo de ARHAUS">
            <form action="login.php" method="POST">
                <p id="login-error" style="display:none;color:#e21313;font-size:0.9rem;margin:0 0 10px;"></p>

                <!-- EMAIL -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="" required autofocus>
                <!-- PASSWORD -->
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="" required>

                <button type="button" class="ver-clave" data-ver-clave aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path class="ver-clave__ojo" d="M1.8 12S5.4 5.5 12 5.5 22.2 12 22.2 12 18.6 18.5 12 18.5 1.8 12 1.8 12Z"/>
                        <circle class="ver-clave__ojo" cx="12" cy="12" r="3.2"/>
                        <path class="ver-clave__tachado" d="M4 20 20 4"/>
                    </svg>
                    <span data-ver-clave-texto>Mostrar contraseña</span>
                </button>

                <div class="o-bien"><span>o</span></div>

                <!-- Entrar con Google. El identificador de acá abajo NO es
                     un secreto (va en el HTML a la vista); el mismo está en
                     lib/google.php, que es donde el servidor comprueba que
                     el acceso sea de este sitio. Si se rehace la credencial,
                     hay que cambiarlo en los dos lados. -->
                <div id="g_id_onload"
                     data-client_id="218470589355-9f5d0u0d492m26mtqftorf07pd2i2sf2.apps.googleusercontent.com"
                     data-login_uri="https://arhaus.com.ar/google.php"
                     data-context="signin"
                     data-ux_mode="redirect"
                     data-auto_prompt="false"></div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-theme="filled_black"
                     data-shape="pill"
                     data-text="signin_with"
                     data-size="large"
                     data-locale="es-419"
                     data-logo_alignment="center"></div>

                <label class="recordarme">
                    <input type="checkbox" name="recordarme" value="1">
                    <span>Mantener la sesión iniciada</span>
                </label>

                <input type="submit" value="Log In">

                <p class="pie-login">¿No tenés cuenta? Pedísela al estudio.</p>
            </form>
        </div>
    </div>

    <script>
        var parametros = new URLSearchParams(location.search);
        var aviso = document.getElementById('login-error');

        if (parametros.get('error') === '1') {
            aviso.textContent = 'Email o contraseña incorrectos.';
            aviso.style.display = 'block';
        }

        // Lo que puede salir mal al entrar con Google. El servidor manda
        // un motivo corto y acá se traduce a algo que se entienda.
        var motivosGoogle = {
            'sin-cuenta': 'Ese correo de Google no está dado de alta. Pedile el acceso al estudio, o entrá con tu email y contraseña.',
            'invalido': 'No pudimos confirmar tu cuenta de Google. Probá de nuevo.',
            'sin-google': 'No pudimos hablar con Google en este momento. Probá de nuevo o entrá con tu email y contraseña.',
            'csrf': 'Se venció el intento de entrar con Google. Probá de nuevo.',
            'sin-token': 'Google no nos mandó los datos. Probá de nuevo.'
        };
        var motivo = parametros.get('google');
        if (motivo && motivosGoogle[motivo]) {
            aviso.textContent = motivosGoogle[motivo];
            aviso.style.display = 'block';
        }

        // El ojito: muestra la contraseña mientras se escribe, para poder
        // revisar que esté bien antes de mandarla.
        (function () {
            var boton = document.querySelector('[data-ver-clave]');
            var campo = document.getElementById('password');
            if (!boton || !campo) return;

            boton.addEventListener('click', function () {
                var seVe = campo.type === 'text';
                campo.type = seVe ? 'password' : 'text';
                boton.classList.toggle('esta-viendo', !seVe);
                boton.setAttribute('aria-pressed', String(!seVe));
                var rotulo = boton.querySelector('[data-ver-clave-texto]');
                if (rotulo) rotulo.textContent = seVe ? 'Mostrar contraseña' : 'Ocultar contraseña';
                // El foco vuelve al campo, al final del texto, para poder seguir escribiendo.
                campo.focus();
                var largo = campo.value.length;
                try { campo.setSelectionRange(largo, largo); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
